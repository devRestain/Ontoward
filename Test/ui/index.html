<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ontoward · 로컬 테스트</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="topbar"><span class="brand">ONTOWARD <span class="muted">/ TEST</span></span><span class="badge">로컬 공개 증례</span></header>
<main class="app-shell">
  <div class="intro"><div><p class="eyebrow">CONSULTATION LAB</p><h1>테스트 실행</h1><p class="muted">환자와의 대화부터 진단 제출까지, 실제 진행 과정을 확인하세요.</p></div></div>
  <form id="launch" class="launch-form">
    <div class="field"><label for="case">공개 증례</label><select id="case" name="case"><option value="C10">C10 · 체중 감소</option><option value="C01">C01 · 수면 불편</option><option value="C03">C03 · 성장 우려</option></select></div>
    <div class="field"><label for="backend">응답 방식</label><select id="backend" name="backend"><option value="nova">NOVA 모델</option><option value="scripted">오프라인 고정 응답</option></select></div>
    <div class="field"><label for="maximum">NOVA 요청 상한</label><input id="maximum" name="maximum" type="number" min="1" max="1000" step="1" value="200" required aria-describedby="mode-help"></div>
    <button id="start" type="submit" class="primary" disabled>NOVA 테스트 실행</button>
    <p id="mode-help" class="form-help">루트 .env의 키로 개발 크레딧을 사용합니다. 환자·진찰·Gateway 호출을 합쳐 최대 200회 요청합니다.</p>
  </form>
  <div id="run-status" class="run-status" role="status" aria-live="polite"><span class="badge">연결 중</span><strong>실행기를 확인하고 있습니다.</strong></div>
  <div id="progress" class="progress-line" aria-hidden="true"></div>
  <div class="results-header"><h2>실행 결과</h2><div class="history-control"><label for="history">저장된 실행</label><select id="history"><option value="">실행 기록 없음</option></select><a id="standalone" href="#" target="_blank" rel="noopener" hidden>별도 열기</a></div></div>
  <p id="empty" class="empty">증례와 실행 조건을 선택하고 테스트를 시작하세요.<br>완료되면 대화·턴별 상태·진단 근거가 이곳에 표시됩니다.</p>
  <iframe id="report" title="선택한 테스트의 진료 과정 리포트" hidden></iframe>
</main>
</body></html>
