name: ontoward

include:
  - Extraction/compose.yaml

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /workspace
    environment:
      NOVA_API_BASE: ${NOVA_API_BASE:-https://nova.snubhai.org}
      NOVA_DEV_KEY: ${NOVA_DEV_KEY:-}
      NOVA_GUIDELINES_DIR: ${NOVA_GUIDELINES_DIR:-/workspace/assets/guidelines}
    volumes:
      - type: bind
        source: .
        target: /workspace
    stdin_open: true
    tty: true

  package:
    profiles: [tools]
    image: ontoward-package:local
    build:
      context: .
      dockerfile: Dockerfile
      target: package
    working_dir: /submission
    network_mode: none
    read_only: true
    volumes:
      - type: bind
        source: ./submission
        target: /submission
        read_only: true
      - type: bind
        source: ./Tmp/packaging
        target: /output
